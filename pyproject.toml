[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tiltshift-3d"
version = "1.0.0"
description = "Smartphone-controlled IoTtalk 3D survival arcade"
requires-python = ">=3.12"
dependencies = ["panda3d>=1.10.16,<1.11", "requests>=2.31,<3", "paho-mqtt~=2.1.0"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
tiltshift = "tiltshift.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
